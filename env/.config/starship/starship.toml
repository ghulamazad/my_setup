format = """
[╭─](bold cyan)$directory
[╰─](bold cyan)$character """

right_format = """
$python\
$golang\
$rust\
$nodejs\
$lua\
$c\
$cpp\
$java\
$kotlin\
$php\
$ruby\
$dotnet\
$swift\
$dart\
$elixir\
$erlang\
$zig\
$haskell\
$ocaml\
$scala\
$perl\
$docker_context\
$git_branch\
$git_status\
$cmd_duration"""

add_newline = true


# ══════════════════════════════════════════════
# DIRECTORY
# ══════════════════════════════════════════════

[directory]
style = "bold blue"
format = "[󰉋 $path]($style)"
truncation_length = 1
truncate_to_repo = false


# ══════════════════════════════════════════════
# PROGRAMMING LANGUAGES
# ══════════════════════════════════════════════

[python]
symbol = "󰌠 "
style = "bold yellow"
format = "[$symbol$version]($style) "

[golang]
symbol = "󰟓 "
style = "bold cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol$version]($style) "

[lua]
symbol = "󰢱 "
style = "bold blue"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[cpp]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[java]
symbol = "󰬷 "
style = "bold red"
format = "[$symbol$version]($style) "

[kotlin]
symbol = "󱈙 "
style = "bold purple"
format = "[$symbol$version]($style) "

[php]
symbol = "󰌟 "
style = "bold purple"
format = "[$symbol$version]($style) "

[ruby]
symbol = "󰴭 "
style = "bold red"
format = "[$symbol$version]($style) "

[dotnet]
symbol = "󰪮 "
style = "bold blue"
format = "[$symbol$version]($style) "

[swift]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[dart]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[elixir]
symbol = " "
style = "bold purple"
format = "[$symbol$version]($style) "

[erlang]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[zig]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[haskell]
symbol = " "
style = "bold purple"
format = "[$symbol$version]($style) "

[ocaml]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[scala]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[perl]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "


# ══════════════════════════════════════════════
# TOOLS
# ══════════════════════════════════════════════

[docker_context]
symbol = "󰡨 "
style = "bold blue"
format = "[$symbol$context]($style) "


# ══════════════════════════════════════════════
# GIT
# ══════════════════════════════════════════════

[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style)"


# ══════════════════════════════════════════════
# COMMAND DURATION
# ══════════════════════════════════════════════

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[󱎫 $duration]($style) "


# ══════════════════════════════════════════════
# PROMPT
# ══════════════════════════════════════════════

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"


# ══════════════════════════════════════════════
# DISABLED / NOISY MODULES
# ══════════════════════════════════════════════

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[helm]
disabled = true

[conda]
disabled = true