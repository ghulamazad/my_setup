"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyo_night"

[palettes.tokyo_night]
blue      = "#7aa2f7"
cyan      = "#7dcfff"
teal      = "#73daca"
green     = "#9ece6a"
yellow    = "#e0af68"
orange    = "#ff9e64"
red       = "#f7768e"
purple    = "#bb9af7"
subtext   = "#565f89"

format = """
$directory\
$git_branch\
$git_status\
$golang\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold purple"
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold orange"
format = "[$all_status$ahead_behind]($style) "

[golang]
symbol = " "
style = "bold blue"
format = "via [$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "bold subtext"
format = "took [$duration]($style) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[username]
disabled = true
[hostname]
disabled = true
[os]
disabled = true
[time]
disabled = true
[jobs]
disabled = true
[memory_usage]
disabled = true