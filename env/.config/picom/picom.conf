# =============================================================================
# Picom Compositor — GLX backend for NVIDIA
# =============================================================================
backend = "glx";
vsync = true;
glx-copy-from-front = false;
unredir-if-possible = true;

# Rounded corners
corner-radius = 4;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Opacity
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.45;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "class_g = 'Polybar'",
    "class_g = 'flameshot'"
];
