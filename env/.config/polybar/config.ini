; Imports
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[settings]
screenchange-reload = true
pseudo-transparency = true

[bar/i3]
monitor               = ${env:MONITOR}
width                 = 100%
height                = 24pt
radius                = 0
background            = #EE16161E
foreground            = ${colors.text}
line-size             = 2pt
border-size           = 1
border-color          = ${colors.surface1}
padding-left          = 0
padding-right         = 1
module-margin         = 1

; MesloLGS Nerd Font
font-0 = MesloLGS Nerd Font:size=10.5;3
font-1 = MesloLGS Nerd Font:size=10.5:style=Bold;3
font-2 = MesloLGS Nerd Font:size=10.5:style=ExtraBold;3
font-3 = MesloLGS Nerd Font:size=9.5;3
font-4 = MesloLGS Nerd Font:size=11.5;3

modules-left   = i3
modules-center = date
modules-right  = network temperature cpu memory filesystem uptime pipewire battery
cursor-click   = pointer
cursor-scroll  = ns-resize
enable-ipc     = true
tray-position  = right
tray-padding   = 3
tray-maxsize   = 16
tray-background = #EE16161E
