# ~/.config/mpv/input.conf
# Custom key bindings for mpv.
# Default bindings are disabled; everything you want is defined here.

# input-default-bindings=no

# =========================
# Playback
# =========================
SPACE cycle pause
s stop
Ctrl+q quit

# =========================
# Fullscreen
# =========================
f cycle fullscreen
ESC set fullscreen no

# =============dd============
# Volume
# =========================
UP add volume 5
DOWN add volume -5
m cycle mute

# Mouse wheel volume (VLC-style)
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# =========================
# Seeking (with OSD bar)
# =========================
RIGHT osd-msg-bar seek 10
LEFT osd-msg-bar seek -10

Shift+RIGHT osd-msg-bar seek 60
Shift+LEFT osd-msg-bar seek -60

Alt+RIGHT osd-msg-bar seek 3
Alt+LEFT osd-msg-bar seek -3

# =========================
# Mouse
# =========================
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen

# =========================
# Playlist
# =========================
n playlist-next
p playlist-prev

# Remembered playlist bindings
> playlist-next
< playlist-prev

# =========================
# Subtitles
# =========================
v cycle sub

# Next / previous subtitle track
J cycle sub
K cycle sub down

# Subtitle delay
g add sub-delay -0.1
h add sub-delay +0.1

# =========================
# Audio
# =========================
# Next / previous audio track
a cycle audio
A cycle audio down

# Audio delay
k add audio-delay -0.1
l add audio-delay +0.1

# =========================
# Chapter navigation
# =========================
! add chapter -1
@ add chapter 1

# =========================
# Frame-by-frame stepping
# =========================
. frame-step
, frame-back-step

# =========================
# Screenshot
# =========================
# Current config: Shift+S includes subtitles
Shift+s screenshot

# Remembered screenshot without subtitles:
# s screenshot video
#
# Can't use it because s is currently assigned to STOP.

# =========================
# OSD / Stats
# =========================
i script-binding stats/display-stats-toggle

# =========================
# Playback Speed (VLC-style)
# =========================
[ add speed -0.1
] add speed 0.1

+ add speed 0.5
- add speed -0.5

= set speed 1.0

# =========================
# Zoom
# =========================
z add video-zoom 0.1
x add video-zoom -0.1

# Move zoomed video
Ctrl+LEFT  add video-pan-x -0.05
Ctrl+RIGHT add video-pan-x  0.05
Ctrl+UP    add video-pan-y -0.05
Ctrl+DOWN  add video-pan-y  0.05

# =========================
# Rotate video clockwise
# =========================
r cycle_values video-rotate 90 180 270 0

# =========================
# Clipboard paste (Wayland)
# =========================
# Ctrl+V: open a file path from clipboard
Ctrl+v run wl-paste | head -1 | xargs -I{} mpv {}
