input-default-bindings=no

# =========================
# Playback
# =========================
SPACE cycle pause
s stop
Ctrl+q quit

# =========================
# Fullscreen
# =========================
f cycle fullscreen
ESC set fullscreen no

# =========================
# Volume
# =========================
UP add volume 5
DOWN add volume -5
m cycle mute

# Mouse wheel volume (VLC-style)
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# =========================
# Seeking (with OSD bar)
# =========================
RIGHT osd-msg-bar seek 10
LEFT osd-msg-bar seek -10

Shift+RIGHT osd-msg-bar seek 60
Shift+LEFT osd-msg-bar seek -60

Alt+RIGHT osd-msg-bar seek 3
Alt+LEFT osd-msg-bar seek -3

# =========================
# Mouse
# =========================
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen

# =========================
# Playlist
# =========================
n playlist-next
p playlist-prev

# =========================
# Subtitles
# =========================
v cycle sub
g add sub-delay -0.1
h add sub-delay +0.1

# =========================
# Audio delay (moved away from + -)
# =========================
k add audio-delay -0.1
l add audio-delay +0.1

# =========================
# Screenshot
# =========================
Shift+s screenshot

# =========================
# Playback Speed (VLC-style)
# =========================
] add speed 0.1
[ add speed -0.1

+ add speed 0.5
- add speed -0.5

= set speed 1.0

# =========================
# Zoom (separate from speed)
# =========================
z add video-zoom 0.1
x add video-zoom -0.1