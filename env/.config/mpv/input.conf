# ~/.config/mpv/input.conf
# Custom key bindings for mpv.
# Only overrides that differ from defaults are listed.
# Full default map: https://mpv.io/manual/stable/#default-key-bindings

# ── Speed control (muscle-memory friendly) ────────────────────────────────────
[          speed multiply 0.9   # slow down
]          speed multiply 1.1   # speed up
\          set speed 1.0        # reset to 1x

# ── Frame-by-frame stepping ───────────────────────────────────────────────────
.          frame-step            # step one frame forward (default)
,          frame-back-step      # step one frame back   (default)

# ── Subtitle control ──────────────────────────────────────────────────────────
J          cycle sub            # next subtitle track
K          cycle sub down       # previous subtitle track (shift J → K)
z          sub-delay +0.1       # delay subtitles +100ms
Z          sub-delay -0.1       # advance subtitles -100ms

# ── Audio ─────────────────────────────────────────────────────────────────────
a          cycle audio          # next audio track
A          cycle audio down     # previous audio track

# ── Chapter navigation ────────────────────────────────────────────────────────
!          add chapter -1       # previous chapter
@          add chapter  1       # next chapter

# ── Screenshot ────────────────────────────────────────────────────────────────
s          screenshot video     # save current frame (no subtitles)
S          screenshot           # save current frame (with subtitles)

# ── OSD info ─────────────────────────────────────────────────────────────────
i          script-binding stats/display-stats-toggle   # toggle stats overlay

# ── Playlist (for directory / playlist mode) ──────────────────────────────────
>          playlist-next        # next file
<          playlist-prev        # previous file

# ── Clipboard paste (Wayland) ─────────────────────────────────────────────────
# Ctrl+v: open a file path from clipboard
Ctrl+v     run wl-paste | head -1 | xargs -I{} mpv {}
