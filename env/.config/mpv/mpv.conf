# ~/.config/mpv/mpv.conf
# Opinionated mpv config: clean UI, high quality output, GPU acceleration.
# Omarchy/Wayland/Hyprland environment.

# ── Video ─────────────────────────────────────────────────────────────────────
vo=gpu-next                    # best GPU backend (replaces old 'gpu')
gpu-api=vulkan                 # Vulkan: best for Wayland/Hyprland
hwdec=vaapi                    # hardware video decode via VAAPI (Intel/AMD)
hwdec-codecs=all               # decode any codec in hw if possible

# Scale with high-quality algorithms for upscaling/downscaling
scale=ewa_lanczos              # high quality luma upscale
cscale=ewa_lanczos             # high quality chroma upscale
dscale=mitchell                # downscale
correct-downscaling=yes
sigmoid-upscaling=yes

# ── HDR / colour ──────────────────────────────────────────────────────────────
target-colorspace-hint=yes     # pass display colorspace to GPU for HDR

# ── Audio ─────────────────────────────────────────────────────────────────────
audio-pitch-correction=yes     # keep pitch when playing at speed != 1x
volume-max=150                 # allow amplification above 100% for quiet sources
af=acompressor                 # soft-limit sudden loud moments

# ── Subtitles ─────────────────────────────────────────────────────────────────
sub-auto=fuzzy                 # find subtitles with similar names nearby
sub-font=JetBrainsMono Nerd Font
sub-font-size=44
sub-border-size=2.5
sub-color='#FFFFFFFF'
sub-border-color='#CC000000'
sub-shadow-offset=1
sub-shadow-color='#80000000'
blend-subtitles=yes

# ── OSD ───────────────────────────────────────────────────────────────────────
osd-font=JetBrainsMono Nerd Font
osd-font-size=36
osd-bar-h=2                    # thin progress bar
osd-bar-align-y=-1             # pin to bottom
osd-duration=2000              # OSD message visible for 2 seconds
osd-level=1

# ── UI / window ───────────────────────────────────────────────────────────────
keep-open=yes                  # don't close window when playback ends
save-position-on-quit=yes      # resume where you left off
geometry=60%                   # start at 60% of screen size
autofit-larger=100%x90%        # never go bigger than screen
border=no                      # frameless window (matches Hyprland decoration)
cursor-autohide=1000           # hide cursor after 1 second idle

# ── Playback ──────────────────────────────────────────────────────────────────
loop-playlist=inf              # loop playlist by default
hr-seek=yes                    # precise seek (slightly slower)
speed=1.0

# ── Screenshots ───────────────────────────────────────────────────────────────
screenshot-format=png
screenshot-png-compression=3   # faster write, slightly larger file
screenshot-directory=~/Pictures/mpv
screenshot-template="%F_%wH%wM%wS"   # filename: title_HH:MM:SS

# ── Cache ─────────────────────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
