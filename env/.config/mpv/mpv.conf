# Video output — works with PRIME
vo=gpu-next
gpu-api=opengl
hwdec=auto-safe

# HDR tonemapping
tone-mapping=bt.2446a
hdr-compute-peak=yes

# Audio
audio-channels=stereo

# Enable modern UI (OSC)
osc=yes
osd-bar=yes

# Window + fullscreen behavior
keep-open=yes
force-window=yes

# Volume settings (like VLC)
volume=100
volume-max=200

# Seek settings
hr-seek=yes

# Subtitles (VLC-like defaults)
sub-auto=fuzzy
sub-font-size=40

# Screenshot format
screenshot-format=png

# Show time/seek info like VLC
osd-duration=2000

# Enable mouse support
input-default-bindings=no
input-vo-keyboard=yes