# =============================================================================
# Tmux Configuration — Tokyo Night Theme & Productivity
# =============================================================================

# ── General Settings ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Tokyo Night Status Bar & Borders ──────────────────────────────────────────
set -g status-position bottom
set -g status-style 'bg=#16161e fg=#7aa2f7'
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#7aa2f7'

set -g status-left-length 30
set -g status-left '#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e,fg=#7aa2f7] '
set -g status-right '#[fg=#565f89]%Y-%m-%d #[fg=#7dcfff]%I:%M %p #[bg=#24283b,fg=#c0caf5] #H '

setw -g window-status-current-style 'bg=#24283b fg=#7dcfff bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#565f89'
setw -g window-status-format ' #I:#W '

# ── Copy Mode (vi) ────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# ── Splits & Windows (Preserve Current Path) ──────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-like Pane Navigation ──────────────────────────────────────────────────
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── Quick Notes / Project Switching ───────────────────────────────────────────
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/personal/dev/todo.md"
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
