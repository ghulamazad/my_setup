# ~/.config/tmux/tmux.conf
# ==============================================================================
# Custom tmux config — built for a Go/Java/Rust/Node/Python dev workflow,
# paired with a matching Neovim config (Kanagawa theme, vim-tmux-navigator,
# LSP/DAP across all 5 languages). QWERTY-optimized prefix, not copied
# wholesale from any single reference config.
# ==============================================================================

# --- Prefix: Ctrl-a ---
# Chosen over tmux's default Ctrl-b (awkward reach) and Ctrl-Space
# (collides conceptually with Neovim's leader key). Ctrl-a sits right
# next to Ctrl on the QWERTY home row — minimal hand movement.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Core behavior ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"          # true color — matches termguicolors in Neovim
set -sg escape-time 10                        # low delay so Neovim's <Esc> doesn't feel laggy inside tmux
set -g base-index 1                           # windows numbered from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on                    # keep window numbers contiguous after closing one
set -g history-limit 50000                    # long scrollback for verbose Maven/build output
set -g mouse on                                # matches mouse=a in Neovim
set -g focus-events on                        # lets Neovim detect terminal focus in/out correctly
set -g set-clipboard on                       # integrate tmux copy with system clipboard where supported
set -g window-size latest                     # always size to the most recently active client —
                                               # fixes tmux "shrink-locking" a session to a smaller
                                               # terminal that attached at some point, which shows up
                                               # as a small centered pane with large margins

# --- Reload config fast while iterating ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# --- Vi-mode copy (matches Neovim's vim motions, not emacs-style) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# ^ wl-copy assumes Wayland/Hyprland (Omarchy default). If you're ever
#   on an X11 session instead, swap to: xclip -in -selection clipboard
bind -T copy-mode-vi / send -X search-forward
bind -T copy-mode-vi ? send -X search-backward

# --- Splits: match Neovim's splitright/splitbelow mental model ---
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Seamless Neovim <-> tmux pane navigation ---
# Forwards C-h/j/k/l into Neovim when it's the active pane's running
# process (vim-tmux-navigator on the Neovim side picks it up from
# there); otherwise moves between tmux panes directly. This is what
# makes one set of keys work identically across both tools.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# --- Pane resizing, repeatable without re-pressing prefix each time ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window navigation ---
# Note: prefix + 0-9 (select window by number) and prefix + n / p
# (next/previous window) are tmux BUILT-IN DEFAULTS and already work
# with no config needed — e.g. Ctrl-a 1, Ctrl-a 2, Ctrl-a n, Ctrl-a p.
# The Alt-based binds below are just faster alternatives that skip
# the prefix entirely.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1

# --- Session management ---
bind C new-session -c "#{pane_current_path}"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind X kill-session

# --- Extra productivity binds ---

# Quick scratch terminal — floating popup shell for a one-off command,
# without disturbing your current window/pane layout at all.
bind-key -r C-Space display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Synchronize panes — type once, sends to every pane in the window.
# Useful for restarting multiple services at once (e.g. several
# Spring Boot modules, or a frontend+backend pair) with one command.
bind-key S setw synchronize-panes \; display-message "Sync panes toggled"

# Break current pane into its own window, and rejoin it back.
bind-key ! break-pane
bind-key @ join-pane -t !

# Zoom current pane to fill the window (documented here explicitly —
# tmux binds this by default, listed for visibility in your own config)
bind-key z resize-pane -Z

# --- Status bar: bottom, minimal, small ---
# Sparser than a typical themed bar — muted colors, no separators,
# no bold, recedes into the background rather than demanding attention.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#16161d,fg=#727169"
set -g status-left-length 20
set -g status-right-length 40
set -g status-left "#[fg=#7e9cd8] #S "
set -g status-right "#[fg=#54546d]%H:%M "
setw -g window-status-current-style "fg=#e6c384"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#54546d"
